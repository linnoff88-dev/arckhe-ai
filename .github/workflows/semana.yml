name: semana-arkhe

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar próximo post
        id: pub
        run: |
          out=$(node scripts/semana.mjs || true)
          echo "$out"
          if [[ "$out" == PUBLICADO* ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit e push (se mudou)
        if: steps.pub.outputs.published == 'true'
        run: |
          git config user.name "arckhe-bot"
          git config user.email "arckhe-bot@users.noreply.github.com"
          git add comunidade/semana-arkhe
          git diff --cached --quiet || git commit -m "semana-arkhe: publicar próximo post"
          git push
      - name: Postar no canal Telegram
        if: steps.pub.outputs.published == 'true'
        env:
          ARCKHE_BOT_TOKEN: ${{ secrets.ARCKHE_BOT_TOKEN }}
          ARCKHE_CHAT_ID: ${{ secrets.ARCKHE_CHAT_ID }}
        run: node scripts/telegram.mjs
